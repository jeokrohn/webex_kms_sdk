[project]
name = "webex-kms-sdk"
version = "0.1.0"
description = "Async Python SDK slice for Webex Mercury communication and KMS-backed decryption"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Webex KMS SDK Contributors" }]
keywords = ["webex", "kms", "mercury", "encryption", "e2ee"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "jwcrypto>=1.5.6",
  "websockets>=12.0",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "python-dotenv>=1.2.2",
  "respx>=0.21.0",
  "ruff>=0.8.0",
  "twine>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webex_kms_sdk"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/docs",
  "/examples",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
