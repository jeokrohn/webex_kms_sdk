[project]
name = "webex-kms-sdk"
version = "0.1.0"
description = "Async Python SDK slice for Webex Mercury communication and KMS-backed decryption"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "Webex KMS SDK Contributors" }]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "jwcrypto>=1.5.6",
  "websockets>=12.0",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "python-dotenv>=1.2.2",
  "respx>=0.21.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webex_kms_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
